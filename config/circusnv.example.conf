# Example CircuSNV settings file. Copy it, keep only the lines you want to change, and pass
# it with --config FILE. It is read as bash: KEY="value", no spaces around '='.
# Order of precedence: built-in defaults < this file < command-line options.
# The values shown are the built-in defaults.

# --- Environment modules (names as on the cluster) ---------------------------------------
# MODULE_ZLIB="zlib/1.2.12-GCCcore-11.3.0"
# MODULE_HTSLIB="HTSlib/1.19.1-GCCcore-11.3.0"
# MODULE_BCFTOOLS="BCFtools/1.19-GCCcore-11.3.0"
# MODULE_SAMTOOLS="SAMtools/1.19.2-GCCcore-11.3.0"
# MODULE_SAMTOOLS_PON="SAMtools/1.16.1-GCCcore-11.3.0"
# MODULE_R="R/4.2.2-foss-2022a-bare"
# MODULE_GATK="GATK/4.3.0.0-GCCcore-11.3.0-Java-11"
# MODULE_GCC_MNVISTA="GCC/13.3.0"
# MODULE_IGV="IGV"
# MODULE_BEDTOOLS="BEDTools"

# --- Resources (default: inside the CircuSNV installation directory) --------------------
# ENV_DIR="<install_dir>/env"                       # Python venv with OpenCRAVAT
# MNVISTA="<install_dir>/MNVista"
# MNV_PON="<install_dir>/MNV_PoN_No_overlap_new.txt"
# UNMET_BED="<install_dir>/hg38_genome.UNMET_bin10bp.bed"
# PON_DIR="<install_dir>/PoN"                       # work directory for the panel of normals
# UNMET_URL_BASE="http://web16.kazusa.or.jp/data/hg38"

# --- Fixed values ---------------------------------------------------------------------------
# UNMET_THRESHOLD="0.90"       # keep variants with an UNMET score below this value
# PON_MIN_NORMALS_PCT="20"     # single-tool PoN variants must occur in this % of normals
# MUTECT2_JAVA_MEM="15G"

# --- Defaults of command-line options -------------------------------------------------------
# VAF=0.001
# RDP=100
# Calls=1
# Qual=25
# MRD=3
# SB=0.9
# PRIOR=0.5
# THREADS=12
